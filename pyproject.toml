[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-startup-program-data"
version = "0.1.0"
description = "Compare startup admission, stage requirements, equity and perks."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-startup-program-data = "book_startup_program_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_startup_program_data = ["*.json"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Correctness, import order and modern syntax; the compact one-line test style is kept.
select = ["E4", "E9", "F", "I", "B", "UP"]
